<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Changelog & Status</title>
    <!-- Authentic In-Game Minecraft Font -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/South-Paw/typeface-minecraft@master/index.css">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Minecraft', monospace;
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: none;
            user-select: none;
        }

        body {
            background-color: #12100e;
            background-image: 
                radial-gradient(#1e1a16 15%, transparent 16%),
                radial-gradient(#1e1a16 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        /* Server Announcement Banner */
        .status-banner {
            max-width: 900px;
            width: 100%;
            margin-bottom: 20px;
            padding: 14px 20px;
            border-radius: 4px;
            border: 3px solid #000;
            display: none;
            box-shadow: 0 6px 20px rgba(0,0,0,0.8);
            line-height: 1.5;
        }

        .status-maintenance {
            background: #521515;
            border-color: #ff5555;
            color: #ffe6e6;
        }

        .status-online {
            background: #193d14;
            border-color: #55ff55;
            color: #e6ffe6;
        }

        .status-title {
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .status-body {
            font-size: 11px;
            opacity: 0.95;
        }

        /* Main Workspace Wrapper */
        .workspace {
            display: flex;
            gap: 25px;
            max-width: 900px;
            width: 100%;
            align-items: stretch;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* Leather Book Cover */
        .book-container {
            background: #472611;
            border: 4px solid #241107;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 2px 2px 0px #6d3d1d, inset -2px -2px 0px #1a0c04;
            padding: 12px;
            border-radius: 6px;
            flex: 1;
            min-width: 320px;
            max-width: 500px;
        }

        .page {
            background: #c8b693;
            border: 3px solid #8e7b57;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.15);
            padding: 25px 22px;
            min-height: 520px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .book-title {
            text-align: center;
            color: #3f3627;
            font-size: 16px;
            border-bottom: 2px solid #8e7b57;
            padding-bottom: 8px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .page-content {
            flex-grow: 1;
            color: #2b251b;
            font-size: 12px;
            line-height: 1.6;
            overflow-y: auto;
            max-height: 420px;
            padding-right: 4px;
        }

        .page-content::-webkit-scrollbar { width: 5px; }
        .page-content::-webkit-scrollbar-thumb { background: #8e7b57; }

        .update-version { font-size: 15px; color: #1f1a13; font-weight: bold; margin-bottom: 2px; }
        .update-date { font-size: 10px; color: #64553f; margin-bottom: 14px; display: block; }

        .category-header {
            color: #5c3b1e;
            font-size: 12px;
            font-weight: bold;
            margin-top: 14px;
            margin-bottom: 6px;
            border-bottom: 1px dashed #a4916c;
            padding-bottom: 3px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .change-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .change-list li {
            position: relative;
            padding-left: 12px;
            font-size: 11px;
        }

        .change-list li::before {
            content: '•';
            position: absolute;
            left: 0;
            color: #55442e;
        }

        .ink-tag { font-size: 10px; font-weight: bold; display: inline-block; margin-right: 4px; }
        .ink-add { color: #1e7025; }
        .ink-fix { color: #174ea6; }
        .ink-change { color: #a36200; }
        .ink-remove { color: #a81c1c; }

        .book-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            border-top: 2px dashed #a4916c;
            padding-top: 10px;
        }

        .nav-btn {
            background: #8e7b57;
            border: 2px solid #3f3627;
            color: #fff;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 11px;
            box-shadow: inset 1px 1px 0px #b4a37f, inset -1px -1px 0px #5c4e33;
        }
        .nav-btn:hover:not(:disabled) { background: #9d8962; }
        .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .page-counter { font-size: 11px; color: #64553f; }

        /* Bookshelf Library */
        .library-container {
            background: #2b180d;
            border: 4px solid #140b06;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 2px 2px 0px #4d2b17, inset -2px -2px 0px #0a0503;
            border-radius: 6px;
            width: 320px;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }

        .library-header {
            color: #e5c38c;
            font-size: 14px;
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 3px solid #140b06;
            text-transform: uppercase;
            text-shadow: 1px 1px #000;
        }

        .library-shelf {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            max-height: 450px;
            padding-right: 4px;
        }

        .shelf-book {
            background: #6e3319;
            border: 2px solid #000;
            padding: 9px 12px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: inset 1px 1px 0px #9b4b27, inset -1px -1px 0px #381a0d;
            transition: all 0.1s ease;
        }
        .shelf-book:hover { background: #884020; transform: translateX(-4px); }
        .shelf-book.active {
            background: #395c2b;
            border-color: #55ff55;
            box-shadow: inset 1px 1px 0px #558b40, inset -1px -1px 0px #1d3016;
        }
        .shelf-book-title { color: #ffffff; font-size: 11px; text-shadow: 1px 1px #000; }
        .shelf-book-date { color: #d1b899; font-size: 10px; }
    </style>
</head>
<body>

    <!-- SERVER NOTICE / MAINTENANCE ALERT -->
    <div class="status-banner" id="status-banner">
        <div class="status-title" id="status-title">⚡ SERVER NOTICE</div>
        <div class="status-body" id="status-body">Loading notice...</div>
    </div>

    <div class="workspace">
        <!-- BOOK -->
        <div class="book-container">
            <div class="page">
                <div>
                    <div class="book-title">Server Logbook</div>
                    <div class="page-content" id="page-content">Opening archives...</div>
                </div>

                <div class="book-footer">
                    <button class="nav-btn" id="prev-btn" onclick="turnPage(-1)">&#9664; Prev</button>
                    <span class="page-counter" id="page-counter">Page 1 of 1</span>
                    <button class="nav-btn" id="next-btn" onclick="turnPage(1)">Next &#9654;</button>
                </div>
            </div>
        </div>

        <!-- LIBRARY ARCHIVE -->
        <div class="library-container">
            <div class="library-header">&#128218; Library Archive</div>
            <div class="library-shelf" id="library-shelf"></div>
        </div>
    </div>

    <script>
        let changelogPages = [];
        let currentPage = 0;

        // PARSER: Converts {https://link}[Clickable Label] into styled <a> links
        function parseLinks(text) {
            if (!text) return "";
            return text.replace(/\{(https?:\/\/[^\}]+)\}\[([^\]]+)\]/g, (match, url, label) => {
                return `<a href="${url}" target="_blank" rel="noopener noreferrer" style="color: #174ea6; text-decoration: underline; font-weight: bold; cursor: pointer;">${label}</a>`;
            });
        }

        fetch('changelog.json?t=' + Date.now())
            .then(res => res.json())
            .then(data => {
                if (data.updates) {
                    renderAnnouncement(data.announcement);
                    changelogPages = data.updates;
                } else {
                    changelogPages = data;
                }
                renderPage();
            })
            .catch(err => {
                document.getElementById('page-content').innerHTML = "Could not load changelog.";
            });

        function renderAnnouncement(ann) {
            if (!ann || !ann.enabled) return;
            const banner = document.getElementById('status-banner');
            const title = document.getElementById('status-title');
            const body = document.getElementById('status-body');

            banner.className = `status-banner status-${ann.type}`;
            title.innerHTML = ann.type === "maintenance" ? "🛠 SERVER MAINTENANCE" : "📢 ANNOUNCEMENT";
            body.innerHTML = parseLinks(ann.message);
            banner.style.display = "block";
        }

        function renderShelf() {
            const shelfEl = document.getElementById("library-shelf");
            shelfEl.innerHTML = changelogPages.map((page, idx) => `
                <div class="shelf-book ${idx === currentPage ? 'active' : ''}" onclick="selectPage(${idx})">
                    <span class="shelf-book-title">&#128214; ${page.version}</span>
                    <span class="shelf-book-date">${page.date}</span>
                </div>
            `).join('');
        }

        function renderPage() {
            if (!changelogPages || changelogPages.length === 0) return;
            const pageData = changelogPages[currentPage];
            const contentEl = document.getElementById("page-content");
            const counterEl = document.getElementById("page-counter");
            const prevBtn = document.getElementById("prev-btn");
            const nextBtn = document.getElementById("next-btn");

            let itemsHtml = pageData.changes.map(c => {
                if (c.type === "separator") {
                    return `<div class="category-header">✦ ${parseLinks(c.text)} ✦</div>`;
                }
                return `<li><span class="ink-tag ${c.type}">[${c.tag}]</span> ${parseLinks(c.text)}</li>`;
            }).join('');

            contentEl.innerHTML = `
                <div class="update-version">${parseLinks(pageData.version)}</div>
                <span class="update-date">${pageData.date}</span>
                <ul class="change-list">${itemsHtml}</ul>
            `;

            counterEl.innerText = `Page ${currentPage + 1} of ${changelogPages.length}`;
            prevBtn.disabled = currentPage === 0;
            nextBtn.disabled = currentPage === changelogPages.length - 1;

            renderShelf();
        }

        function turnPage(delta) {
            currentPage += delta;
            renderPage();
        }

        function selectPage(index) {
            currentPage = index;
            renderPage();
        }
    </script>
</body>
</html>
