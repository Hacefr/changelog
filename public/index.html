<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changelog Admin Panel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/South-Paw/typeface-minecraft@master/index.css">

    <style>
        * { box-sizing: border-box; font-family: 'Minecraft', monospace; }
        body {
            background-color: #12100e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .auth-card {
            background: #1e1e1e;
            border: 3px solid #3f3f3f;
            padding: 30px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        .dashboard {
            display: none;
            gap: 25px;
            max-width: 1100px;
            width: 100%;
            align-items: flex-start;
        }

        .editor-pane {
            background: #1a1a1a;
            border: 3px solid #333333;
            padding: 22px;
            flex: 1;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .preview-pane {
            width: 380px;
            background: #472611;
            border: 4px solid #241107;
            padding: 10px;
            border-radius: 6px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .page {
            background: #c8b693;
            border: 3px solid #8e7b57;
            padding: 20px;
            min-height: 480px;
            color: #2b251b;
        }

        .preview-title { font-size: 13px; font-weight: bold; border-bottom: 2px solid #8e7b57; padding-bottom: 5px; margin-bottom: 8px; text-align: center; }
        .preview-ver { font-size: 13px; font-weight: bold; margin-bottom: 2px; }
        .preview-date { font-size: 10px; color: #64553f; margin-bottom: 12px; display: block; }
        .preview-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; font-size: 11px; line-height: 1.5; }
        
        .category-header { color: #5c3b1e; font-size: 11px; font-weight: bold; margin-top: 8px; border-bottom: 1px dashed #8e7b57; padding-bottom: 2px; text-transform: uppercase; }

        .ink-tag { font-size: 10px; font-weight: bold; margin-right: 4px; }
        .ink-add { color: #1e7025; }
        .ink-fix { color: #174ea6; }
        .ink-change { color: #a36200; }
        .ink-remove { color: #a81c1c; }

        .input-group { margin-bottom: 14px; }
        label { display: block; color: #888; font-size: 11px; margin-bottom: 5px; }

        input, select {
            width: 100%;
            background: #0d0d0d;
            border: 2px solid #333;
            color: #fff;
            padding: 8px 10px;
            font-size: 12px;
            outline: none;
        }
        input:focus { border-color: #55ff55; }

        .item-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }

        .btn {
            background: #333;
            border: 2px solid #000;
            color: #fff;
            padding: 8px 12px;
            cursor: pointer;
            box-shadow: inset 1px 1px 0px #555;
            font-size: 11px;
        }
        .btn:hover { background: #444; }
        .btn-green { background: #275e21; color: #a5ffa0; }
        .btn-green:hover { background: #32752b; }
        .btn-red { background: #691c1c; color: #ffa8a8; }
        .btn-gold { background: #634316; color: #ffd699; }

        .announcement-box {
            background: #141414;
            border: 2px dashed #444;
            padding: 12px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- AUTH PANEL -->
    <div class="auth-card" id="auth-panel">
        <h2 id="auth-title" style="color: #55ff55; margin-bottom: 15px; font-size: 16px;">Checking system...</h2>
        <div class="input-group">
            <label>Admin Username</label>
            <input type="text" id="auth-user" placeholder="Username">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="auth-pass" placeholder="Password">
        </div>
        <button class="btn btn-green" id="auth-btn" onclick="submitAuth()">Submit</button>
        <p id="auth-msg" style="color: #ff5555; font-size: 11px; margin-top: 12px;"></p>
    </div>

    <!-- MAIN DASHBOARD -->
    <div class="dashboard" id="dash-panel">
        
        <div class="editor-pane">
            
            <!-- ANNOUNCEMENT BANNER SETTER -->
            <div class="announcement-box">
                <label style="color: #ffaa00; font-size: 12px; font-weight: bold; margin-bottom: 8px;">📢 Server Notice / Maintenance Alert</label>
                <div style="display: flex; gap: 10px; margin-bottom: 8px;">
                    <select id="ann-enabled" style="width: 140px;">
                        <option value="false">Banner: Disabled</option>
                        <option value="true">Banner: Active</option>
                    </select>
                    <select id="ann-type" style="width: 140px;">
                        <option value="maintenance">Maintenance (Red)</option>
                        <option value="online">Notice (Green)</option>
                    </select>
                </div>
                <input type="text" id="ann-msg" placeholder="e.g. Server is down for updates! Back online in ~30 mins.">
            </div>

            <div style="display: flex; gap: 8px; margin-bottom: 15px; border-bottom: 2px solid #333; padding-bottom: 12px;">
                <select id="version-select" onchange="loadSelectedVersion()"></select>
                <button class="btn btn-green" onclick="createNewVersion()">+ New Update</button>
                <button class="btn btn-red" onclick="deleteVersion()">Delete</button>
            </div>

            <div class="input-group">
                <label>Version Title</label>
                <input type="text" id="edit-ver" oninput="updateLivePreview()" placeholder="e.g. Friday Update (v1.19.2)">
            </div>

            <div class="input-group">
                <label>Date (DD/MM/YY)</label>
                <input type="text" id="edit-date" oninput="updateLivePreview()">
            </div>

            <div class="input-group">
                <label>Changes & Categories</label>
                <div id="items-container"></div>
                <div style="margin-top: 8px; display: flex; gap: 8px;">
                    <button class="btn" onclick="addChangeRow('ADD', 'ink-add', '')">+ Add Change</button>
                    <button class="btn btn-gold" onclick="addSeparatorRow('CATEGORY NAME')">+ Add Section Header</button>
                </div>
            </div>

            <div style="margin-top: 25px; display: flex; gap: 10px;">
                <button class="btn btn-green" onclick="publishAllToGitHub()">Publish All to GitHub</button>
                <button class="btn btn-red" onclick="logout()">Logout</button>
            </div>
            <p id="dash-msg" style="font-size: 11px; margin-top: 12px;"></p>
        </div>

        <div class="preview-pane">
            <div class="page">
                <div class="preview-title">Live Preview</div>
                <div class="preview-ver" id="prev-ver">v0.0</div>
                <span class="preview-date" id="prev-date">00/00/00</span>
                <ul class="preview-list" id="prev-list"></ul>
            </div>
        </div>

    </div>

    <script>
        let changelogData = { announcement: { enabled: false, type: "maintenance", message: "" }, updates: [] };
        let currentIndex = 0;
        let isRegistered = false;
        let token = localStorage.getItem("mc_admin_token");

        function getTodayDDMMYY() {
            const now = new Date();
            return `${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getFullYear()).slice(-2)}`;
        }

        async function initAuth() {
            // If already logged in, go straight to dashboard!
            if (token) {
                showDashboard();
                return;
            }

            try {
                const res = await fetch('/api/auth/status');
                const data = await res.json();
                isRegistered = data.isRegistered;

                if (isRegistered) {
                    document.getElementById('auth-title').innerText = "Admin Login";
                    document.getElementById('auth-btn').innerText = "Login";
                } else {
                    document.getElementById('auth-title').innerText = "Create Admin Account";
                    document.getElementById('auth-btn').innerText = "Register Account";
                }
            } catch (e) {
                document.getElementById('auth-title').innerText = "Connecting...";
            }
        }

        async function submitAuth() {
            const user = document.getElementById('auth-user').value.trim();
            const pass = document.getElementById('auth-pass').value.trim();
            const endpoint = isRegistered ? '/api/auth/login' : '/api/auth/register';

            const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass })
            });
            const data = await res.json();

            if (data.success) {
                // Instantly save token and open dashboard (NO RELOAD!)
                localStorage.setItem("mc_admin_token", data.token);
                token = data.token;
                showDashboard();
            } else {
                document.getElementById('auth-msg').innerText = data.error;
            }
        }

        async function showDashboard() {
            document.getElementById('auth-panel').style.display = 'none';
            document.getElementById('dash-panel').style.display = 'flex';

            const res = await fetch('/api/changelog');
            const raw = await res.json();

            if (Array.isArray(raw)) {
                changelogData = {
                    announcement: { enabled: false, type: "maintenance", message: "" },
                    updates: raw
                };
            } else {
                changelogData = raw;
            }

            document.getElementById('ann-enabled').value = String(changelogData.announcement.enabled);
            document.getElementById('ann-type').value = changelogData.announcement.type;
            document.getElementById('ann-msg').value = changelogData.announcement.message || "";

            if (!changelogData.updates || changelogData.updates.length === 0) {
                createNewVersion();
            } else {
                populateVersionDropdown();
                loadSelectedVersion();
            }
        }

        function populateVersionDropdown() {
            const select = document.getElementById('version-select');
            select.innerHTML = changelogData.updates.map((p, i) => `<option value="${i}">${p.version} (${p.date})</option>`).join('');
            select.value = currentIndex;
        }

        function loadSelectedVersion() {
            currentIndex = parseInt(document.getElementById('version-select').value);
            const page = changelogData.updates[currentIndex];
            document.getElementById('edit-ver').value = page.version;
            document.getElementById('edit-date').value = page.date;

            const container = document.getElementById('items-container');
            container.innerHTML = '';
            page.changes.forEach(c => {
                if (c.type === "separator") {
                    addSeparatorRow(c.text);
                } else {
                    addChangeRow(c.tag, c.type, c.text);
                }
            });

            updateLivePreview();
        }

        function createNewVersion() {
            const newPage = {
                version: "v" + (changelogData.updates.length + 1) + ".0 - New Update",
                date: getTodayDDMMYY(),
                changes: [
                    { type: "separator", text: "GENERAL" },
                    { tag: "ADD", type: "ink-add", text: "New features added." }
                ]
            };
            changelogData.updates.unshift(newPage);
            currentIndex = 0;
            populateVersionDropdown();
            loadSelectedVersion();
        }

        function deleteVersion() {
            if (changelogData.updates.length <= 1) return alert("Must have at least one update!");
            if (confirm(`Delete ${changelogData.updates[currentIndex].version}?`)) {
                changelogData.updates.splice(currentIndex, 1);
                currentIndex = 0;
                populateVersionDropdown();
                loadSelectedVersion();
            }
        }

        function addChangeRow(tag = "ADD", type = "ink-add", text = "") {
            const container = document.getElementById('items-container');
            const row = document.createElement('div');
            row.className = 'item-row change-item-row';
            row.innerHTML = `
                <select style="width: 100px;" onchange="updateLivePreview()">
                    <option value="ink-add" ${type === 'ink-add' ? 'selected' : ''}>[ADD]</option>
                    <option value="ink-fix" ${type === 'ink-fix' ? 'selected' : ''}>[FIX]</option>
                    <option value="ink-change" ${type === 'ink-change' ? 'selected' : ''}>[CHANGE]</option>
                    <option value="ink-remove" ${type === 'ink-remove' ? 'selected' : ''}>[REMOVE]</option>
                </select>
                <input type="text" placeholder="Description of change..." value="${text}" oninput="updateLivePreview()" class="row-text">
                <button class="btn btn-red" onclick="this.parentElement.remove(); updateLivePreview();">X</button>
            `;
            container.appendChild(row);
            updateLivePreview();
        }

        function addSeparatorRow(title = "CATEGORY NAME") {
            const container = document.getElementById('items-container');
            const row = document.createElement('div');
            row.className = 'item-row separator-item-row';
            row.innerHTML = `
                <span style="color: #ffaa00; font-size: 11px; width: 100px;">✦ SECTION:</span>
                <input type="text" placeholder="e.g. GENERATORS, PVP, FIXES" value="${title}" oninput="updateLivePreview()" class="row-separator-text" style="border-color: #ffaa00; color: #ffea88;">
                <button class="btn btn-red" onclick="this.parentElement.remove(); updateLivePreview();">X</button>
            `;
            container.appendChild(row);
            updateLivePreview();
        }

        function updateLivePreview() {
            const ver = document.getElementById('edit-ver').value;
            const date = document.getElementById('edit-date').value;

            document.getElementById('prev-ver').innerText = ver || "Untitled Version";
            document.getElementById('prev-date').innerText = date || "00/00/00";

            const container = document.getElementById('items-container');
            const listEl = document.getElementById('prev-list');
            listEl.innerHTML = '';
            const changes = [];

            Array.from(container.children).forEach(r => {
                if (r.classList.contains('separator-item-row')) {
                    const txt = r.querySelector('.row-separator-text').value.trim();
                    changes.push({ type: "separator", text: txt });
                    const div = document.createElement('div');
                    div.className = 'category-header';
                    div.innerText = `✦ ${txt} ✦`;
                    listEl.appendChild(div);
                } else if (r.classList.contains('change-item-row')) {
                    const sel = r.querySelector('select');
                    const txt = r.querySelector('.row-text').value;
                    const tag = sel.options[sel.selectedIndex].text.replace(/[\[\]]/g, '');
                    changes.push({ tag, type: sel.value, text: txt });
                    const li = document.createElement('li');
                    li.innerHTML = `<span class="ink-tag ${sel.value}">[${tag}]</span> ${txt || "..."}`;
                    listEl.appendChild(li);
                }
            });

            if (changelogData.updates[currentIndex]) {
                changelogData.updates[currentIndex] = { version: ver, date, changes };
                document.getElementById('version-select').options[currentIndex].text = `${ver} (${date})`;
            }
        }

        async function publishAllToGitHub() {
            const msg = document.getElementById('dash-msg');
            msg.style.color = '#55ffff';
            msg.innerText = "Publishing directly to GitHub Pages...";

            changelogData.announcement = {
                enabled: document.getElementById('ann-enabled').value === "true",
                type: document.getElementById('ann-type').value,
                message: document.getElementById('ann-msg').value.trim()
            };

            const res = await fetch('/api/save-changelog', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, data: changelogData })
            });

            const resData = await res.json();
            if (resData.success) {
                msg.style.color = '#55ff55';
                msg.innerText = "Successfully published! Players can now see it on GitHub.";
            } else {
                msg.style.color = '#ff5555';
                msg.innerText = resData.error;
            }
        }

        function logout() {
            localStorage.removeItem("mc_admin_token");
            location.reload();
        }

        initAuth();
    </script>
</body>
</html>
